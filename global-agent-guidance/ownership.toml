schema_version = 1
policy_date = "2026-08-23"
policy_status = "proposed"
purpose = "Reciprocal agent ownership guardrails with unrestricted reads and proposal-only writes."

[semantics]
read_access = "allow"
write_includes = ["create", "modify", "rename", "delete", "stage", "commit"]
path_globs_are_home_relative = true
repo_relative_globs_apply_to_worktrees = true
resolve_symlinks_for_matching = true

[change_control]
required_process = "branch-and-pull-request"
required_reviewer = "other-agent"
disagreement = "agents-attempt-consensus-then-shawn-decides"
loosening_requires = "shawn-sign-off"
tightening_requires = "other-agent-approval"

[[agents]]
id = "claude"
home_repository = "~/personal-assistant"
proposal_routes = ["~/gpt-hub/integration-records/", "a shared planning document", "the current conversation"]

[[agents]]
id = "codex"
name = "Sol"
home_repository = "~/gpt-hub"
proposal_routes = ["~/gpt-hub/integration-records/", "a shared planning document", "the current conversation"]

[[denials]]
id = "claude-sol-home"
denied_agent = "claude"
owner = "codex"
operations = ["write"]
path_globs = ["~/gpt-hub/**", "~/.codex/**"]

[[denials]]
id = "claude-codex-repository-surfaces"
denied_agent = "claude"
owner = "codex"
operations = ["write"]
scope_repo = "*"
repo_relative_globs = ["AGENTS.md", "**/AGENTS.md", "AGENTS.override.md", "**/AGENTS.override.md", ".codex/**", "**/.codex/**"]

[[denials]]
id = "codex-claude-global"
denied_agent = "codex"
owner = "claude"
operations = ["write"]
path_globs = ["~/.claude/**"]

[[denials]]
id = "codex-claude-repository-surfaces"
denied_agent = "codex"
owner = "claude"
operations = ["write"]
scope_repo = "*"
repo_relative_globs = ["CLAUDE.md", "**/CLAUDE.md", ".claude/**", "**/.claude/**"]

[[denials]]
id = "codex-pa-harness"
denied_agent = "codex"
owner = "claude"
operations = ["write"]
scope_repo = "personal-assistant"
repo_relative_globs = [
  ".claude/**",
  "CLAUDE.md",
  "agents/**",
  "commands/**",
  "global-claude-md/**",
  "hooks/**",
  "output-styles/**",
  "settings.json",
  "settings-template.json",
  "skills/**",
  "scripts/compose-global-claude-md.sh",
  "setup.sh",
]

[[denials]]
id = "codex-pa-operations"
denied_agent = "codex"
owner = "claude"
operations = ["write"]
scope_repo = "personal-assistant"
repo_relative_globs = [
  "archive/**",
  "data/**",
  "logs/**",
  "memories/**",
  "notes/**",
  "reports/**",
  "standups/**",
  "tasks/**",
  "wiki/claude-observations.md",
  "wiki/continuity.md",
]

[[verification_cases]]
id = "claude-gpt-hub"
rule_id = "claude-sol-home"
agent = "claude"
operation = "create"
path = "~/gpt-hub/.ownership-guard-claude-test"
expected = "deny"

[[verification_cases]]
id = "claude-codex-home"
rule_id = "claude-sol-home"
agent = "claude"
operation = "create"
path = "~/.codex/.ownership-guard-claude-test"
expected = "deny"

[[verification_cases]]
id = "claude-agents-md"
rule_id = "claude-codex-repository-surfaces"
agent = "claude"
operation = "open-write"
path = "~/gpt-hub/AGENTS.md"
expected = "deny"

[[verification_cases]]
id = "codex-claude-home"
rule_id = "codex-claude-global"
agent = "codex"
operation = "create"
path = "~/.claude/.ownership-guard-codex-test"
expected = "deny"

[[verification_cases]]
id = "codex-claude-md"
rule_id = "codex-claude-repository-surfaces"
agent = "codex"
operation = "open-write"
path = "~/personal-assistant/CLAUDE.md"
expected = "deny"

[[verification_cases]]
id = "codex-nested-claude-md"
rule_id = "codex-claude-repository-surfaces"
agent = "codex"
operation = "open-write"
path = "~/Code/map-reader-llm/CLAUDE.md"
expected = "deny"

[[verification_cases]]
id = "codex-pa-memory-symlink"
rule_id = "codex-pa-operations"
