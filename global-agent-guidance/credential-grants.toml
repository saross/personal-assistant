schema_version = 1
policy_date = "2026-08-24"
policy_status = "proposed-empty"
purpose = "Per-variable credential grants for the Codex personal/trusted launcher."
source_env = "~/personal-assistant/.env"
grants = []

[semantics]
grant_unit = "one-environment-variable-per-service-or-scope"
paid_service_grants_are_per_machine = true
personal_trusted_only = true
restricted_input_receives_credentials = false
launcher_injection_precedes_loader_setdefault = true
credential_values_must_not_be_logged = true

[change_control]
required_process = "branch-and-pull-request"
required_reviewer = "other-agent"
loosening_requires = "shawn-sign-off"
tightening_requires = "other-agent-approval"
