schema_version = 2
policy_date = "2026-09-07"
policy_status = "proposed"
purpose = "Per-variable credential grants for the Codex personal/trusted launcher."
source_env = "~/personal-assistant/.env"

# One grant is one variable. `source_name` is the variable as it exists in the
# credential file; `inject_as` is the name the launcher exports inside the
# sandbox. They differ only when the natural name would collide with something
# on the host — see the first grant. Values are never copied into this file,
# any log, or any model context; `scripts/check-credentials.py` verifies that
# every `source_name` exists and that the token still authenticates.

[[grants]]
id = "github-pat-gpt"
service = "github"
source_name = "GPT_GH_TOKEN"
inject_as = "GH_TOKEN"
profiles = ["personal-trusted"]
purpose = "git push over HTTPS and gh pull-request operations from the Codex sandbox"
token_kind = "fine-grained personal access token"
resource_owner = "saross"
repository_access = "selected repositories (list held on GitHub, not here)"
permissions = ["contents:read-write", "pull-requests:read-write", "metadata:read"]
excluded = ["admin:org", "delete_repo", "workflows"]
granted_by = "shawn"
granted_on = "2026-09-07"
expires_on = "none"
expiry_note = "No expiry by Shawn's decision (2026-09-07): he rotates by hand; 90 days is too short and GitHub offers no 180-day option. check-credentials.py verifies this record matches the live token."
verified_on = "2026-09-07"
verified_by = "scripts/check-credentials.py — account saross, push access to saross/gpt-hub confirmed"
naming_note = "Not stored as GH_TOKEN: Claude's session hooks shell-source .env, and a GH_TOKEN there would silently override Shawn's keyring-backed gh login on the host."

[semantics]
grant_unit = "one-environment-variable-per-service-or-scope"
injected_name_may_differ_from_source_name = true
paid_service_grants_are_per_machine = true
personal_trusted_only = true
restricted_input_receives_credentials = false
launcher_injection_precedes_loader_setdefault = true
credential_values_must_not_be_logged = true
launcher_must_not_shell_source_env = true
launcher_must_validate_variable_names = "[A-Z0-9_]+"

[change_control]
required_process = "branch-and-pull-request"
required_reviewer = "other-agent"
loosening_requires = "shawn-sign-off"
tightening_requires = "other-agent-approval"
